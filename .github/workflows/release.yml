name: Release

on:
  push:
    tags: ['v*']
  # Manual runs build and upload artifacts only; the release step fires on
  # tag refs alone.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/sysc-clipboard ./cmd/sysc-clipboard
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: sysc-clipboard-binaries
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets."
            gh release upload "$tag" dist/* --clobber
            exit 0
          fi
          gh release create "$tag" dist/* --verify-tag --latest --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
