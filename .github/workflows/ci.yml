name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this one to re-run the same checks against the
  # tagged commit. A called run is pinned to the tag, so the tree under test
  # is the tree that ships.
  workflow_call:

# Supersede in-flight runs for the same branch or PR so a burst of pushes does
# not queue a full build each.
concurrency:
  # The suffix names the workflow file rather than the run. A called workflow
  # sees the caller's workflow name, so an unsuffixed group would be shared
  # by the release run and by the checks it calls, and the two would cancel
  # each other.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...

  verify:
    uses: Nomadcxx/.github/.github/workflows/go-verify.yml@cd88b2e0b04be9dee5a2becf3a4586b108dd9c11
    with:
      go-version-file: go.mod
      run-build: true
      extra-setup: false
